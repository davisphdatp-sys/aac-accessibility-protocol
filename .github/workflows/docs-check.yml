name: Docs check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            #node_modules

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,403,429 --exclude-path node_modules './**/*.md'
          fail: true

  no-long-dashes:
    name: No long dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for em or en dashes
        run: |
          if grep -rnP '[\x{2012}-\x{2015}\x{2212}]' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo 'Em or en dash found. Replace with a comma, colon, or hyphen.'
            exit 1
          fi
