name: Bug or documentation problem
description: Report a bug or accessibility problem with this repository
title: ""
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PROTOCOL.md
        - ACR-TEMPLATE.md
        - PROCUREMENT-CHECKLIST.md
        - README or other docs
        - Issue templates or CI
        - Accessibility of this repository
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
      placeholder: "e.g., The link to WCAG 2.2 in VO-01 is broken..."
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: File name and heading, or line number
      placeholder: "e.g., PROTOCOL.md, VoiceOver Tests section, line 45"

  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested fix
      description: How would you fix this? (optional)
      placeholder: "e.g., Update the link to..."
